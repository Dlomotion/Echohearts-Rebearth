name: Meta Systems Verify

on:
  pull_request:
    paths:
      - '09_Technical/MetaSystems/**'
      - '.github/workflows/meta-systems-verify.yml'
  push:
    paths:
      - '09_Technical/MetaSystems/**'
      - '.github/workflows/meta-systems-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S 09_Technical/MetaSystems -B build/meta-systems -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build/meta-systems --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build/meta-systems --output-on-failure
