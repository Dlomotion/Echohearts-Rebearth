name: Echohearts infrastructure checks

on:
  push:
    branches: [main, develop, codex/ue58-manual-pipeline-20261003]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compiler driver syntax
        run: python -m py_compile 09_Technical/Tools/EchoheartsCompiler.py
      - name: Echohearts repository contract
        run: python 09_Technical/Tools/EchoheartsCompiler.py repo-check
      - name: Infrastructure contract regression tests
        run: python -m unittest discover -s 09_Technical/Tools -p 'test_*.py'
      - name: Infrastructure contract
        run: python 09_Technical/Tools/verify_infrastructure.py infrastructure
      - name: Recovery plan remains non-runtime
        run: python 09_Technical/Tools/verify_infrastructure.py recovery-plan
