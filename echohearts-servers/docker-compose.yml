services:
  multiplayer:
    build:
      context: .
      dockerfile: Dockerfile.multiplayer
    ports:
      - "7777:7777"
    restart: unless-stopped
  web:
    build:
      # Context is the REPO ROOT: Dockerfile.web copies echohearts-playable/,
      # echohearts-rebirth-game/ and echohearts-servers/web/server.py, which are
      # siblings at the root — they are not inside echohearts-servers/.
      context: ..
      dockerfile: echohearts-servers/Dockerfile.web
    environment:
      # Inside the compose network the multiplayer server is the "multiplayer"
      # service — 127.0.0.1 here would point the web container at itself.
      ECHOHEARTS_MP_HOST: "multiplayer"
      ECHOHEARTS_MP_PORT: "7777"
    ports:
      - "8080:8080"
    restart: unless-stopped
