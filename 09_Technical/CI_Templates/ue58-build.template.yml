# TEMPLATE ONLY — NOT ACTIVE CI
# Move into .github/workflows only after the canonical .uproject path,
# UE5.8 runner labels, and trusted-runner security model are verified.

name: UE5.8 Build Validation

on:
  workflow_dispatch:
  push:
    branches: [ ue58-integration ]

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, windows, ue58, trusted]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Validate project path
        shell: pwsh
        run: |
          $Project = "$env:GITHUB_WORKSPACE\EchoheartsRebearth.uproject"
          if (-not (Test-Path $Project)) {
            throw "Canonical .uproject not found: $Project"
          }

      - name: Build / Cook / Package
        shell: pwsh
        run: |
          $UAT = "C:\Program Files\Epic Games\UE_5.8\Engine\Build\BatchFiles\RunUAT.bat"
          $Project = "$env:GITHUB_WORKSPACE\EchoheartsRebearth.uproject"

          if (-not (Test-Path $UAT)) {
            throw "UE5.8 RunUAT not found: $UAT"
          }

          & $UAT `
            BuildCookRun `
            -project="$Project" `
            -noP4 `
            -platform=Win64 `
            -clientconfig=Development `
            -build -cook -stage -package `
            -utf8output
